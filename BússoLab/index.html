<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Bússolab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-login">

  <div class="login-bg" aria-hidden="true">
    <div class="login-bg__oval"></div>

    <svg class="login-bg__compass" viewBox="0 0 260 260" fill="none">
      <line x1="62" y1="35" x2="76" y2="58" stroke="var(--color-accent-light)" stroke-width="5" stroke-linecap="round"/>
      <line x1="92" y1="20" x2="100" y2="46" stroke="var(--color-accent-light)" stroke-width="5" stroke-linecap="round"/>
      <line x1="36" y1="60" x2="58" y2="76" stroke="var(--color-accent-light)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="130" cy="145" r="88" stroke="var(--color-bg-shape-dark)" stroke-width="14"/>
      <circle cx="130" cy="145" r="72" stroke="var(--color-bg-shape-dark)" stroke-width="2" stroke-dasharray="4 14"/>
      <polygon points="130,145 168,92 145,152" fill="var(--color-accent-light)"/>
      <polygon points="130,145 96,204 115,138" fill="var(--color-bg-shape-dark)"/>
      <circle cx="130" cy="145" r="10" fill="var(--color-bg-page)"/>
    </svg>

    <svg class="login-bg__mountain" viewBox="0 0 260 240" fill="none">
      <path d="M90 230 C110 190, 175 180, 155 145 C140 120, 165 110, 175 100" stroke="var(--color-bg-page)" stroke-width="26" stroke-linecap="round"/>
      <polygon points="175,35 120,105 230,105" fill="var(--color-bg-shape-dark)"/>
      <polygon points="175,35 156,62 170,57 177,64 185,56 196,62" fill="var(--color-surface)"/>
      <line x1="175" y1="12" x2="175" y2="35" stroke="var(--color-bg-shape-dark)" stroke-width="3"/>
      <rect x="175" y="12" width="22" height="13" rx="2" fill="var(--color-accent-light)"/>
    </svg>
  </div>

  <main class="login-card">
    <a href="../home/index.html" class="brand brand--centered">
      <svg class="brand__icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="13" stroke="var(--color-primary)" stroke-width="2.2"/>
        <polygon points="16,16 21,10 18,17" fill="var(--color-accent)"/>
        <polygon points="16,16 11,22 14,15" fill="var(--color-primary)"/>
        <circle cx="16" cy="16" r="1.5" fill="var(--color-surface)"/>
      </svg>
      <span class="brand__text">Bússo<span class="brand__text--accent">lab</span></span>
    </a>

    <h1 class="login-card__title">Seja Bem-Vindo</h1>
    <p class="login-card__subtitle">Entre para continuar sua trilha</p>

    <form class="login-form" action="../home/index.html" method="get">
      <div class="form-group">
        <label for="email" class="form-label">E-mail</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
          <input type="email" id="email" class="form-input" placeholder="seu@email.com" required />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label form-label--inline">
          <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          Senha
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input type="password" id="password" class="form-input" placeholder="Digite sua senha" required />
          <button type="button" class="input-action" aria-label="Mostrar senha" onclick="togglePassword()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--full btn--pill">
        Entrar
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </form>

    <div class="login-card__divider" aria-hidden="true"></div>
  </main>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
