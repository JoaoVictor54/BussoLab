<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Requisição Enviada — Bússolab</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="page-wizard">

  <header class="navbar">
    <div class="container navbar__inner">
      <a href="../home/index.html" class="brand">
        <svg class="brand__icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="13" stroke="var(--color-primary)" stroke-width="2.2"/>
          <polygon points="16,16 21,10 18,17" fill="var(--color-accent)"/>
          <polygon points="16,16 11,22 14,15" fill="var(--color-primary)"/>
          <circle cx="16" cy="16" r="1.5" fill="var(--color-surface)"/>
        </svg>
        <span class="brand__text">Bússo<span class="brand__text--accent">lab</span></span>
      </a>

      <nav class="navbar__nav" aria-label="Menu principal">
        <a href="../tela_mentorias/index.html" class="navbar__link is-active">Mentoria</a>
      </nav>

      <div class="user-profile-pill">
        <span class="user-initials">JV</span>
        <span>João</span>
      </div>
    </div>
  </header>

  <main class="confirmation-main">
    <div class="confirmation-card">
      <div class="confirmation-check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <h1 class="confirmation-card__title">Requisição enviada!</h1>
      <p class="confirmation-card__subtitle">
        Um mentor da área de <strong id="conf-area-inline">Front-end</strong> poderá aceitar sua requisição.<br />
        Avisaremos quando alguém responder.
      </p>

      <div class="confirmation-summary">
        <div class="summary-row">
          <span class="summary-row__label">ÁREA ESCOLHIDA</span>
          <strong class="summary-row__value" id="conf-area">Front-end</strong>
        </div>

        <div class="summary-row">
          <span class="summary-row__label">OBJETIVO</span>
          <strong class="summary-row__value" id="conf-goal">Conseguir meu primeiro estágio em tecnologia</strong>
        </div>

        <div class="summary-row">
          <span class="summary-row__label">FORMATO DE CONVERSA</span>
          <strong class="summary-row__value summary-row__value--accent" id="conf-channel">Chat</strong>
        </div>
      </div>

      <div class="confirmation-actions">
        <a href="../tela_pedir_mentoria/index.html" class="btn btn--accent btn--pill">Ver minhas requisições</a>
        <a href="../home/index.html" class="btn btn--outline btn--pill">Voltar ao início</a>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const area = params.get('area');
    const goal = params.get('objetivo')?.trim();
    const channel = params.get('formato');

    if (area) {
      document.getElementById('conf-area').textContent = area;
      document.getElementById('conf-area-inline').textContent = area;
    }
    if (goal) {
      document.getElementById('conf-goal').textContent = goal;
    }
    if (channel) {
      document.getElementById('conf-channel').textContent = channel;
    }
  </script>
</body>
</html>
