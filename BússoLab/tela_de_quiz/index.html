<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz de Carreira — Bússolab</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="page-wizard">

  <header class="navbar">
    <div class="container navbar__inner">
      <a href="../home/index.html" class="brand">
        <svg class="brand__icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="13" stroke="var(--color-primary)" stroke-width="2.2"/>
          <polygon points="16,16 21,10 18,17" fill="var(--color-accent)"/>
          <polygon points="16,16 11,22 14,15" fill="var(--color-primary)"/>
          <circle cx="16" cy="16" r="1.5" fill="var(--color-surface)"/>
        </svg>
        <span class="brand__text">Bússo<span class="brand__text--accent">lab</span></span>
      </a>
    </div>
  </header>

  <main class="quiz-main">
    <div class="container container--narrow">
      <div class="quiz-progress">
        <div class="progress-bar" role="progressbar" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar__fill" style="width: 90%;"></div>
        </div>
        <span class="quiz-progress__label">Pergunta 1 de 1</span>
      </div>

      <h1 class="quiz-title">Você prefere trabalhar com:</h1>

      <div class="quiz-grid">
        <button type="button" class="quiz-option is-selected">
          <span class="icon-badge icon-badge--lg icon-badge--teal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3a9 9 0 0 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4c3.1 0 5.6-2.5 5.6-5.6C23 5.5 18.1 3 12 3z"/>
              <circle cx="7.5" cy="11.5" r="1" fill="currentColor"/>
              <circle cx="10.5" cy="8.5" r="1" fill="currentColor"/>
              <circle cx="14.5" cy="8.5" r="1" fill="currentColor"/>
            </svg>
          </span>
          <span class="quiz-option__text">Criar e desenhar coisas visuais</span>
        </button>

        <button type="button" class="quiz-option">
          <span class="icon-badge icon-badge--lg icon-badge--purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="8 7 3 12 8 17"/>
              <polyline points="16 7 21 12 16 17"/>
              <line x1="14" y1="5" x2="10" y2="19"/>
            </svg>
          </span>
          <span class="quiz-option__text">Resolver problemas lógicos</span>
        </button>

        <button type="button" class="quiz-option">
          <span class="icon-badge icon-badge--lg icon-badge--mint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <line x1="7" y1="18" x2="7" y2="14"/>
              <line x1="12" y1="18" x2="12" y2="10"/>
              <line x1="17" y1="18" x2="17" y2="6"/>
            </svg>
          </span>
          <span class="quiz-option__text">Analisar números e dados</span>
        </button>

        <button type="button" class="quiz-option">
          <span class="icon-badge icon-badge--lg icon-badge--blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="8" r="3.5"/>
              <path d="M3 19c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
              <circle cx="17" cy="9" r="2.5"/>
              <path d="M16 19c0-2.2 1.6-4 3.5-4.3"/>
            </svg>
          </span>
          <span class="quiz-option__text">Conversar e convencer pessoas</span>
        </button>
      </div>

      <p class="quiz-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <line x1="12" y1="11" x2="12" y2="16"/>
          <circle cx="12" cy="8" r="0.8" fill="currentColor"/>
        </svg>
        Não existe resposta certa
      </p>

      <div class="wizard-footer">
        <a href="../home/index.html" class="btn btn--ghost">← Voltar</a>
        <a href="../tela_de_resultado/index.html" class="btn btn--accent btn--pill">Continuar →</a>
      </div>
    </div>
  </main>

  <script>
    const options = document.querySelectorAll('.quiz-option');
    options.forEach((opt) => {
      opt.addEventListener('click', () => {
        options.forEach((o) => o.classList.remove('is-selected'));
        opt.classList.add('is-selected');
      });
    });
  </script>
</body>
</html>
