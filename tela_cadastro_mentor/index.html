<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Mentor — Bússolab</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="page-wizard">

  <header class="navbar">
    <div class="container navbar__inner">
      <a href="../home/index.html" class="brand">
        <svg class="brand__icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="13" stroke="var(--color-primary)" stroke-width="2.2"/>
          <polygon points="16,16 21,10 18,17" fill="var(--color-accent)"/>
          <polygon points="16,16 11,22 14,15" fill="var(--color-primary)"/>
          <circle cx="16" cy="16" r="1.5" fill="var(--color-surface)"/>
        </svg>
        <span class="brand__text">Bússo<span class="brand__text--accent">lab</span></span>
      </a>
    </div>
  </header>

  <main class="mentor-main">
    <div class="container">
      <!-- Topo com título e ilustração de mentores -->
      <div class="banner-header">
        <div>
          <h1 class="banner-header__title">Cadastro de mentor</h1>
          <p class="banner-header__subtitle">Compartilhe sua experiência com quem está começando.</p>
        </div>

        <div class="banner-header__art" aria-hidden="true">
          <svg viewBox="0 0 240 110" fill="none">
            <path d="M20 110 C20 65, 80 35, 130 40 C180 45, 225 70, 225 110 Z" fill="var(--color-bg-shape)"/>
            <!-- Pessoa Esquerda -->
            <circle cx="72" cy="52" r="12" fill="var(--color-info-soft)"/>
            <path d="M52 96c0-11 9-20 20-20s20 9 20 20" fill="var(--color-info-soft)"/>
            <!-- Pessoa Direita -->
            <circle cx="168" cy="52" r="12" fill="var(--color-info-soft)"/>
            <path d="M148 96c0-11 9-20 20-20s20 9 20 20" fill="var(--color-info-soft)"/>
            <!-- Mentor Central -->
            <line x1="106" y1="16" x2="112" y2="24" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="120" y1="12" x2="120" y2="21" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="134" y1="16" x2="128" y2="24" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="120" cy="42" r="15" fill="var(--color-primary)"/>
            <path d="M92 96c0-15.5 12.5-28 28-28s28 12.5 28 28" fill="var(--color-primary)"/>
            <polygon points="120,76 122,81 127.5,81.5 123.5,85 124.5,90 120,87.2 115.5,90 116.5,85 112.5,81.5 118,81" fill="var(--color-surface)"/>
          </svg>
        </div>
      </div>

      <!-- Card do Formulário -->
      <form class="mentor-form-card" action="../tela_mentorias/index.html" method="get">
        <!-- Seção 1: Dados pessoais -->
        <section class="form-section">
          <div class="form-section__header">
            <span class="circle-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/>
                <path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>
              </svg>
            </span>
            <h2>Dados pessoais</h2>
          </div>

          <div class="form-grid form-grid--3">
            <div class="form-group">
              <label for="mentor-name" class="form-label">Nome completo <span class="req">*</span></label>
              <input type="text" id="mentor-name" class="form-input form-input--plain" placeholder="Digite seu nome completo" required />
            </div>

            <div class="form-group">
              <label for="mentor-area" class="form-label">Área de atuação <span class="req">*</span></label>
              <select id="mentor-area" class="form-input form-input--plain" required>
                <option value="" disabled selected>Selecione sua área de atuação</option>
                <option value="dev">Desenvolvimento de Software</option>
                <option value="design">UX/UI Design</option>
                <option value="dados">Análise de Dados</option>
                <option value="marketing">Marketing Digital</option>
              </select>
            </div>

            <div class="form-group">
              <label for="mentor-exp" class="form-label">Tempo de experiência <span class="req">*</span></label>
              <input type="text" id="mentor-exp" class="form-input form-input--plain" placeholder="Ex: 5 anos" required />
            </div>
          </div>
        </section>

        <hr class="section-divider" />

        <!-- Seção 2: Diplomas e certificações -->
        <section class="form-section">
          <div class="form-section__header">
            <span class="circle-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="9" r="5"/>
                <path d="M8.5 13.5L7 21l5-2.5L17 21l-1.5-7.5"/>
              </svg>
            </span>
            <h2>Diplomas e certificações</h2>
          </div>

          <label class="upload-dropzone" id="upload-dropzone" for="mentor-files">
            <input type="file" id="mentor-files" accept=".pdf,.jpg,.jpeg,.png" multiple hidden />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M7 18a4.5 4.5 0 0 1-.4-8.98A6 6 0 0 1 18.2 10a4 4 0 0 1 .8 7.92"/>
              <polyline points="12 12 12 20"/>
              <polyline points="9 15 12 12 15 15"/>
            </svg>
            <div>
              <strong>Arraste seus arquivos aqui ou clique para enviar</strong>
              <span>Formatos aceitos: PDF, JPG, PNG (Tamanho máx. 10MB)</span>
            </div>
          </label>

          <ul class="uploaded-list" id="uploaded-list">
            <li class="uploaded-item">
              <div class="uploaded-item__info">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                  <polyline points="14 3 14 9 20 9"/>
                </svg>
                <span>Certificado_Pós-Graduação_GestãoProjetos.pdf <small>• 2.4 MB</small></span>
              </div>
              <button type="button" class="uploaded-item__remove" aria-label="Remover arquivo">✕</button>
            </li>
            <li class="uploaded-item">
              <div class="uploaded-item__info">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                  <polyline points="14 3 14 9 20 9"/>
                </svg>
                <span>Diploma_de_Graduação.pdf <small>• 1.8 MB</small></span>
              </div>
              <button type="button" class="uploaded-item__remove" aria-label="Remover arquivo">✕</button>
            </li>
          </ul>
        </section>

        <hr class="section-divider" />

        <!-- Seção 3: Disponibilidade -->
        <section class="form-section">
          <div class="form-section__header">
            <span class="circle-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </span>
            <h2>Disponibilidade</h2>
          </div>

          <div class="form-grid form-grid--2">
            <div class="form-group">
              <label for="mentor-days" class="form-label">Dias da semana <span class="req">*</span></label>
              <select id="mentor-days" class="form-input form-input--plain" required>
                <option value="" disabled selected>Selecione os dias</option>
                <option value="seg-qua-sex">Segunda, Quarta e Sexta</option>
                <option value="ter-qui">Terça e Quinta</option>
                <option value="fds">Finais de semana (Sábado e Domingo)</option>
                <option value="flexivel">Horário flexível</option>
              </select>
            </div>

            <div class="form-group">
              <label for="mentor-hours" class="form-label">Horário disponível <span class="req">*</span></label>
              <select id="mentor-hours" class="form-input form-input--plain" required>
                <option value="" disabled selected>Selecione o horário</option>
                <option value="manha">Manhã (08h às 12h)</option>
                <option value="tarde">Tarde (13h às 18h)</option>
                <option value="noite">Noite (18h30 às 22h)</option>
              </select>
            </div>
          </div>
        </section>

        <div class="mentor-form-card__footer">
          <button type="submit" class="btn btn--accent btn--pill mentor-submit-btn">Enviar documento</button>
          <p class="mentor-disclaimer">
            <span class="check-badge" aria-hidden="true">✓</span>
            Seus documentos serão verificados antes da ativação.
          </p>
        </div>
      </form>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('mentor-files');
    const dropzone = document.getElementById('upload-dropzone');
    const uploadedList = document.getElementById('uploaded-list');

    function bindRemoveButtons() {
      uploadedList.querySelectorAll('.uploaded-item__remove').forEach((btn) => {
        btn.onclick = () => btn.closest('.uploaded-item').remove();
      });
    }

    function addFiles(files) {
      Array.from(files).forEach((file) => {
        const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
        const li = document.createElement('li');
        li.className = 'uploaded-item';
        li.innerHTML = `
          <div class="uploaded-item__info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
              <polyline points="14 3 14 9 20 9"/>
            </svg>
            <span>${file.name} <small>• ${sizeMB} MB</small></span>
          </div>
          <button type="button" class="uploaded-item__remove" aria-label="Remover arquivo">✕</button>
        `;
        uploadedList.appendChild(li);
      });
      bindRemoveButtons();
    }

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) addFiles(e.target.files);
    });

    ['dragenter', 'dragover'].forEach((eventName) => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.add('is-dragover');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.remove('is-dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
    });

    bindRemoveButtons();
  </script>
</body>
</html>
